<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizik Asistanı - Fizik Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/themes.css" rel="stylesheet">
    <style>
        .ai-sayfa { display:flex; justify-content:center; min-height:calc(100vh - 100px); padding: 30px 16px 60px; }
        .ai-panel {
            width: 100%; max-width: 720px;
            background: var(--bg-mid);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg, 24px);
            display: flex; flex-direction: column;
            overflow: hidden; height: calc(100vh - 140px); min-height: 480px;
            box-shadow: var(--shadow-glow);
        }
        .ai-ust {
            padding: 18px 22px; border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 12px;
        }
        .ai-ust .ai-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--glass); display: flex; align-items: center; justify-content: center;
            color: var(--accent-cyan); font-size: 1.2rem;
        }
        .ai-ust h1 { font-size: 1.1rem; margin: 0; color: var(--text-primary); }
        .ai-ust p { font-size: 0.78rem; color: var(--text-soft); margin: 0; }
        .ai-ust .durum-nokta {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; margin-left: auto;
            box-shadow: 0 0 8px rgba(34,197,94,.6);
            animation: nabiz 2s infinite;
        }
        @keyframes nabiz {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: .6; }
        }
        .ai-ses-btn {
            background: none; border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-muted);
            width: 34px; height: 34px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            margin-left: 8px; font-size: 13px; transition: all .2s;
        }
        .ai-ses-btn.acik { color: var(--accent-lime); border-color: var(--accent-lime); }
        .ai-mesajlar { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .balon { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
        .balon.ogrenci { align-self: flex-end; background: var(--accent-cyan); color: var(--bg-deep); border-bottom-right-radius: 4px; }
        .balon.asistan { align-self: flex-start; background: var(--bg-deep); color: var(--text-muted); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        .ai-alt { padding: 14px 16px; border-top: 1px solid var(--glass-border); display: flex; gap: 8px; align-items: center; }
        .ai-girdi { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--bg-deep); color: var(--text-primary); font-size: 0.95rem; outline: none; }
        .ai-girdi:focus { border-color: var(--accent-lime); }
        .ai-gonder {
            width: 48px; height: 48px; border: none; border-radius: 50%;
            background: var(--accent-lime); color: var(--bg-deep);
            font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
            transition: transform .12s, box-shadow .12s;
        }
        .ai-gonder:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(200,245,66,.3); }
        .ai-gonder:disabled { opacity: .5; cursor: wait; transform: none; }
        .ai-mikrofon {
            width: 48px; height: 48px; border: none; border-radius: 50%;
            background: var(--accent-cyan); color: var(--bg-deep);
            font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
            transition: transform .12s;
        }
        .ai-mikrofon:hover { transform: translateY(-2px); }
        .ai-mikrofon.kayit {
            background: #ef4444; color: #fff;
            animation: nabiz 1.2s infinite;
        }
        .yaziyor { display: inline-flex; gap: 4px; }
        .yaziyor span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-soft); animation: zipla 1s infinite; }
        .yaziyor span:nth-child(2) { animation-delay: .2s; }
        .yaziyor span:nth-child(3) { animation-delay: .4s; }
        @keyframes zipla { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .balon.sistem {
            align-self: center;
            background: var(--glass);
            color: var(--text-soft);
            font-size: 0.82rem;
            text-align: center;
        }
    </style>
</head>
<body class="theme-warm-amber">

    <div class="page-shell">
        <div id="header-yeri"></div>

        <main class="ai-sayfa">
            <div class="ai-panel">
                <div class="ai-ust">
                    <div class="ai-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div>
                        <h1>Fizik Asistanı</h1>
                        <p>Her zaman açık · Türkçe · Lise fizik</p>
                    </div>
                    <span class="durum-nokta" title="Çevrimiçi"></span>
                    <!-- SESLİ OKUMA AÇ/KAPA -->
                    <button type="button" id="ai-ses-btn" class="ai-ses-btn" title="Sesli cevap aç/kapat">
                        <i class="fa-solid fa-volume-xmark"></i>
                    </button>
                </div>

                <div class="ai-mesajlar" id="ai-mesajlar">
                                        <div class="balon asistan">Merhaba! 👋 Ben FizikPortal asistanın. Fizik sorularını yazabilir ya da 🎤 mikrofona basıp konuşabilirsin. Cevabımı sesli duymak istersen üstteki 🔊 hoparlöre bir kez dokun!</div>
                </div>

                <div class="ai-alt">
                    <input class="ai-girdi" type="text" id="ai-girdi" placeholder="Fizik sorununu yaz... (örn. atış hareketi nedir?)" maxlength="1000">
                    <button class="ai-mikrofon" id="ai-mikrofon" title="Konuşarak sor"><i class="fa-solid fa-microphone"></i></button>
                    <button class="ai-gonder" id="ai-gonder" title="Gönder"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>

        <div id="footer-yeri"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/site.js"></script>
    <script>
        // ── AYARLAR ──
        const AI_URL = 'https://fizik-ai.validebag-fizik.workers.dev';

        const mesajlarAlani = document.getElementById('ai-mesajlar');
        const girdi = document.getElementById('ai-girdi');
        const gonderBtn = document.getElementById('ai-gonder');
        const mikroBtn = document.getElementById('ai-mikrofon');
        const sesBtn = document.getElementById('ai-ses-btn');

        // ── SESLİ OKUMA (yazı → ses) — tarayıcı dahili, ücretsiz ──
        let sesAcik = false;

        if (sesBtn) {
            sesBtn.addEventListener('click', () => {
                sesAcik = !sesAcik;
                sesBtn.innerHTML = sesAcik
                    ? '<i class="fa-solid fa-volume-high"></i>'
                    : '<i class="fa-solid fa-volume-xmark"></i>';
                sesBtn.classList.toggle('acik', sesAcik);
                if (!sesAcik && window.speechSynthesis) speechSynthesis.cancel();

                // İlk açılışta nazik hatırlatma
                if (sesAcik) {
                    balonEkle('🔊 Sesli cevap açıldı! Artık cevaplarımı yüksek sesle de okuyorum.', 'sistem');
                }
            });
        }

        function cevabiOku(metin) {
            if (!sesAcik || !window.speechSynthesis) return;
            // LaTeX kalıntılarını okumadan önce temizle (ses daha doğal olur)
            const temiz = metin
                .replace(/\$\$([^$]+)\$\$/g, '$1')
                .replace(/\$([^$]+)\$/g, '$1')
                .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1) bölü ($2)')
                .replace(/\\cdot/g, ' çarpı ')
                .replace(/\\times/g, ' çarpı ')
                .replace(/\\sqrt\{([^}]+)\}/g, 'karekök $1')
                .replace(/\\text\{([^}]+)\}/g, '$1')
                .replace(/\^\{2\}|\^2/g, ' kare')
                .replace(/\^\{3\}|\^3/g, ' küp')
                .replace(/\*\*([^*]+)\*\*/g, '$1');
            speechSynthesis.cancel();
            const konusma = new SpeechSynthesisUtterance(temiz);
            konusma.lang = 'tr-TR';
            konusma.rate = 1;
            konusma.pitch = 1;
            speechSynthesis.speak(konusma);
        }

        // ── BALON EKLE ──
        function balonEkle(metin, tip) {
            const b = document.createElement('div');
            b.className = 'balon ' + tip;
            b.textContent = metin;
            mesajlarAlani.appendChild(b);
            mesajlarAlani.scrollTop = mesajlarAlani.scrollHeight;
            return b;
        }

        // ── SORU GÖNDER + CEVAP AL ──
        async function soruGonder() {
            const soru = girdi.value.trim();
            if (!soru) return;

            girdi.value = '';
            balonEkle(soru, 'ogrenci');

            const bekleyen = document.createElement('div');
            bekleyen.className = 'balon asistan';
            bekleyen.innerHTML = '<span class="yaziyor"><span></span><span></span><span></span></span>';
            mesajlarAlani.appendChild(bekleyen);
            mesajlarAlani.scrollTop = mesajlarAlani.scrollHeight;

            gonderBtn.disabled = true;
            girdi.disabled = true;

            try {
                let kullanici = '';
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) kullanici = session.user.email;
                } catch (e) {}

                const res = await fetch(AI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ soru, kullanici, kaynak: 'kesfet' })
                });
                const veri = await res.json();

                bekleyen.remove();

                if (veri.cevap) {
                    const temiz = veri.cevap
                        .replace(/\$\$([^$]+)\$\$/g, '$1')
                        .replace(/\$([^$]+)\$/g, '$1')
                        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1)/($2)')
                        .replace(/\\cdot/g, ' · ')
                        .replace(/\\times/g, ' × ')
                        .replace(/\\sqrt\{([^}]+)\}/g, '√($1)')
                        .replace(/\\text\{([^}]+)\}/g, '$1')
                        .replace(/\^\{2\}|\^2/g, '²')
                        .replace(/\^\{3\}|\^3/g, '³')
                        .replace(/\*\*([^*]+)\*\*/g, '$1');
                    balonEkle(temiz, 'asistan');
                    cevabiOku(temiz);   // 📢 ses açıkken okur
                } else {
                    balonEkle(veri.hata || 'Bir sorun oldu, tekrar dener misin?', 'asistan');
                }
            } catch (err) {
                bekleyen.remove();
                balonEkle('Bağlantı hatası. İnternetini kontrol edip tekrar dener misin?', 'asistan');
            } finally {
                gonderBtn.disabled = false;
                girdi.disabled = false;
                girdi.focus();
            }
        }

        gonderBtn.addEventListener('click', soruGonder);
        girdi.addEventListener('keydown', (e) => { if (e.key === 'Enter') soruGonder(); });

        // ── SESLİ GİRİŞ (konuşma → yazı) — Web Speech API, tarayıcı dahili ──
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition && mikroBtn) {
            const tanima = new SpeechRecognition();
            tanima.lang = 'tr-TR';
            tanima.interimResults = false;
            tanima.continuous = false;

            let dinliyor = false;

            mikroBtn.addEventListener('click', () => {
                if (dinliyor) { tanima.stop(); return; }
                try {
                    tanima.start();
                    dinliyor = true;
                    mikroBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
                    mikroBtn.classList.add('kayit');
                } catch (e) {}
            });

            tanima.onresult = (olay) => {
                const metin = olay.results[0][0].transcript;
                girdi.value = metin;
                soruGonder();   // konuşulan soruyu otomatik gönder
            };

            tanima.onend = () => {
                dinliyor = false;
                mikroBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                mikroBtn.classList.remove('kayit');
            };
            tanima.onerror = () => {
                dinliyor = false;
                mikroBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                mikroBtn.classList.remove('kayit');
            };
        } else if (mikroBtn) {
            // Tarayıcı desteklemiyorsa butonu gizle
            mikroBtn.style.display = 'none';
        }
    </script>
</body>
</html>
