<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yorum Onay Paneli - Fizik Portalı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/themes.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .admin-card { background: var(--bg-mid); border: 1px solid var(--glass-border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .yorum-metni { color: var(--text-primary); margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    .yorum-bilgi { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .cevap-input { width: 100%; padding: 10px; background: var(--bg-deep); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight:bold; cursor: pointer; margin-right: 5px; }
    .btn-onay { background: var(--accent-lime); color: var(--bg-deep); }
    .btn-cevap { background: var(--accent-cyan); color: var(--bg-deep); }
    .btn-sil { background: #ef4444; color: #fff; }
  </style>
</head>
<body class="theme-warm-amber">

    <div class="page-shell">
        <div id="header-yeri"></div>
        
        <main style="padding: 40px 24px; max-width: 800px; margin: 0 auto;">
            <h1 style="margin-bottom: 20px; color: var(--text-primary);"><i class="fa fa-gavel"></i> Yorum Onay Paneli</h1>
            <div id="yorum-listesi">Yükleniyor...</div>
        </main>
        
        <div id="footer-yeri"></div>
    </div>

    <script src="assets/js/site.js"></script>
      <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session || session.user.email !== ADMIN_EMAIL) {
                alert("Bu sayfaya erişim yetkiniz yok.");
                window.location.href = "index.html";
                return;
            }
            loadComments();
        });

        async function loadComments() {
            const { data: comments, error } = await supabaseClient.from('comments').select('*').order('created_at', { ascending: false });
            const listEl = document.getElementById('yorum-listesi');
            
            if (error || !comments || comments.length === 0) {
                listEl.innerHTML = "<p style='color:var(--text-muted);'>Hiç yorum bulunmuyor.</p>";
                return;
            }

            let html = '';
            comments.forEach(c => {
                const date = new Date(c.created_at).toLocaleDateString('tr-TR');
                const statusText = c.is_approved ? '<span style="color:var(--accent-lime);">Onaylı</span>' : '<span style="color:#fb923c;">Bekliyor</span>';
                
                html += `
                <div class="admin-card">
                    <div class="yorum-bilgi">
                        <span><strong>${c.user_name}</strong> (${c.user_email}) - ${c.content_id}</span>
                        <span>${date} | ${statusText}</span>
                    </div>
                    <div class="yorum-metni">${c.comment_text}</div>
                    
                    ${c.admin_reply ? `<div style="background: rgba(200, 245, 66, 0.1); border-left: 3px solid var(--accent-lime); padding: 10px; margin-bottom: 10px; border-radius: 4px; color: var(--text-primary);"><strong>Admin Cevabı:</strong> ${c.admin_reply}</div>` : ''}
                    
                    <input type="text" class="cevap-input" id="reply-${c.id}" value="${c.admin_reply || ''}" placeholder="Cevap yazın...">
                    <div>
                        ${!c.is_approved ? `<button class="btn btn-onay" onclick="approveComment('${c.id}')">Onayla</button>` : ''}
                        <button class="btn btn-cevap" onclick="replyComment('${c.id}')">Cevabı Kaydet</button>
                        <button class="btn btn-sil" onclick="deleteComment('${c.id}')">Sil</button>
                    </div>
                </div>`;
            });
            listEl.innerHTML = html;
        }

        async function approveComment(id) {
            await supabaseClient.from('comments').update({ is_approved: true }).eq('id', id);
            loadComments();
        }

        async function replyComment(id) {
            const replyText = document.getElementById('reply-' + id).value;
            const { error } = await supabaseClient.from('comments').update({ admin_reply: replyText }).eq('id', id);
            if (error) { alert("Hata: " + error.message); return; }
            alert("Cevap kaydedildi!");
            loadComments();
        }

        async function deleteComment(id) {
            if (!confirm("Bu yorumu silmek istediğinize emin misiniz?")) return;
            await supabaseClient.from('comments').delete().eq('id', id);
            loadComments();
        }
    </script>
</body>
</html>
