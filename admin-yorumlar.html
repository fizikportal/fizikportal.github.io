<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yorum Onay Paneli</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background:#121212; color:#fff; padding:30px; }
    .kutu { max-width:700px; margin:0 auto; background:#1e1e1e; padding:20px; border-radius:12px; }
    .yorum-kart { background:#2a2a2a; padding:15px; margin-bottom:12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; }
    .btn { padding:8px 14px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-left:5px; }
    .btn-onay { background:#4caf50; color:#fff; }
    .btn-sil { background:#e53935; color:#fff; }
  </style>
</head>
<body>

<div class="kutu">
  <h2>Onay Bekleyen Yorumlar</h2>
  <div id="yorumListesi">Yükleniyor...</div>
</div>

<script>
  const SUPABASE_URL = 'https://xynrvyltphhlctgknsbl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_s4GbYjutbYiSdLEqzDG4gQ_rXbEnFyJ';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 1. Giriş Yapmış mı Kontrol Et (Güvenlik Duvarı için şart)
  _supabase.auth.getSession().then(({ data: { session } }) => {
    if (!session) {
      alert("Bu sayfayı görmek için giriş yapmalısınız!");
      window.location.href = "giris.html"; // Giriş yapmadıysa login sayfasına at
      return;
    }
    // Giriş yapmışsa yorumları yükle
    yorumlariYukle();
  });

  // 2. Yorumları Getir
  async function yorumlariYukle() {
    const { data: yorumlar, error } = await _supabase
      .from('comments') // Tablo adımız comments
      .select('*')
      .eq('is_approved', false); // Sadece onay bekleyenleri (false) getir

    const liste = document.getElementById('yorumListesi');
    liste.innerHTML = '';

    if (error || !yorumlar || yorumlar.length === 0) {
      liste.innerHTML = '<p style="color:#888;">Onay bekleyen yorum bulunmuyor.</p>';
      return;
    }

    yorumlar.forEach(y => {
      liste.innerHTML += `
        <div class="yorum-kart" id="yorum-${y.id}">
          <div>
            <strong>${y.user_email}:</strong>
            <p style="margin:5px 0 0 0; color:#ccc;">${y.comment_text}</p>
          </div>
          <div>
            <button class="btn btn-onay" onclick="durumGuncelle('${y.id}')">Onayla</button>
            <button class="btn btn-sil" onclick="yorumSil('${y.id}')">Sil</button>
          </div>
        </div>
      `;
    });
  }

  // 3. Yorum Onayla
  async function durumGuncelle(id) {
    await _supabase.from('comments').update({ is_approved: true }).eq('id', id);
    document.getElementById(`yorum-${id}`).remove();
  }

  // 4. Yorum Sil
  async function yorumSil(id) {
    await _supabase.from('comments').delete().eq('id', id);
    document.getElementById(`yorum-${id}`).remove();
  }
</script>
</body>
</html>
