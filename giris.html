<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — Fizik Platformu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card bg-secondary text-white p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <h3 class="text-center mb-4">Giriş Yap</h3>
        
        <div class="mb-3">
            <label for="email" class="form-label">E-posta Adresi</label>
            <input type="email" id="email" class="form-control" placeholder="E-posta adresinizi girin">
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Şifre</label>
            <input type="password" id="password" class="form-control" placeholder="Şifrenizi girin">
        </div>
        
        <button id="btn-login" class="btn btn-warning w-100 fw-bold py-2 mt-2">Giriş Yap</button>
        
        <div id="alert-msg" class="mt-3 text-center"></div>
        
        <div class="text-center mt-3" style="font-size: 14px;">
            Hesabınız yok mu? <a href="kayit.html" class="text-warning">Kayıt Ol</a>
        </div>
    </div>

    <script>
        // Supabase Bağlantısı
        const SUPABASE_URL = "https://xynrvyltphhlctgknsbl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_s4GbYjutbYiSdLEqzDG4gQ_rXbEnFyJ"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById("btn-login").addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const alertMsg = document.getElementById("alert-msg");

            if (!email || !password) {
                alertMsg.innerHTML = `<span class="text-danger">Lütfen e-posta ve şifrenizi girin.</span>`;
                return;
            }

            alertMsg.innerHTML = `<span class="text-info">Giriş yapılıyor...</span>`;

            // Kullanıcı Giriş İsteği
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alertMsg.innerHTML = `<span class="text-danger">Hata: ${error.message}</span>`;
            } else {
                alertMsg.innerHTML = `<span class="text-success">Giriş başarılı! Yönlendiriliyorsunuz...</span>`;
                setTimeout(() => {
                    // Giriş yapıldıktan sonra yorum alanının olduğu sayfaya gider
                    window.location.href = "yonetim.html"; 
                }, 800);
            }
        });
    </script>
</body>
</html>
