<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Fizik Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/themes.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="theme-deep-space">
    <div class="page-shell">
        <div id="header-yeri"></div>

        <div class="auth-page">
            <div class="auth-card">
                <h1 class="auth-title">Giriş Yap</h1>
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">
                    Hesabınıza erişmek için bilgilerinizi girin.
                </p>

                <form id="girisForm">
                    <div style="margin-bottom: 16px;">
                        <label for="email" style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-soft);">E-posta</label>
                        <input type="email" id="email" class="auth-input" required placeholder="ornek@email.com">
                    </div>

                    <div style="margin-bottom: 16px;">
                        <label for="password" style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-soft);">Şifre</label>
                        <input type="password" id="password" class="auth-input" required placeholder="••••••••">
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
                        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-muted);">
                            <input type="checkbox" id="rememberMe" style="accent-color: var(--accent-lime);">
                            Beni Hatırla
                        </label>
                        <a href="sifremi_unuttum.html" style="color: var(--accent-cyan); text-decoration: none;">Şifremi Unuttum</a>
                    </div>

                    <button type="submit" class="auth-btn">Giriş Yap</button>
                </form>

                <div class="auth-link">
                    Hesabınız yok mu? <a href="kayit_ol.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Kayıt Ol</a>
                </div>

                <div id="mesajKutusu" style="display: none; margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem;"></div>
            </div>
        </div>

        <div id="footer-yeri"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/site.js"></script>
    <script>
        document.getElementById('girisForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const mesajKutusu = document.getElementById('mesajKutusu');

            mesajKutusu.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email, password
            });

            if (error) {
                mesajKutusu.textContent = '❌ ' + error.message;
                mesajKutusu.style.background = 'rgba(239, 68, 68, 0.15)';
                mesajKutusu.style.color = '#f87171';
                mesajKutusu.style.border = '1px solid rgba(239, 68, 68, 0.4)';
                mesajKutusu.style.display = 'block';
                return;
            }

            // Admin ise PHP session'ı da aç (localhost'ta)
            const isLocalhost = window.location.hostname === 'localhost' 
                             || window.location.hostname === '127.0.0.1'
                             || window.location.hostname.includes('.local');

            if (email === 'validebag.fizik@gmail.com' && isLocalhost) {
                try {
                    const res = await fetch('/edit/admin/giris_dogrula.php', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ access_token: data.session.access_token })
                    });
                    const result = await res.json();
                    if (!result.basarili) {
                        console.warn('PHP session açılamadı:', result.mesaj);
                    }
                } catch (err) {
                    console.warn('PHP session hatası:', err);
                }
            }

            // Başarılı giriş mesajı
            mesajKutusu.textContent = '✅ Giriş başarılı, yönlendiriliyor...';
            mesajKutusu.style.background = 'rgba(34, 197, 94, 0.15)';
            mesajKutusu.style.color = '#22c55e';
            mesajKutusu.style.border = '1px solid rgba(34, 197, 94, 0.4)';
            mesajKutusu.style.display = 'block';

            // Yönlendir
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });
    </script>
</body>
</html>
