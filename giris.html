<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Fizik Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/themes.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .auth-page { display:flex; justify-content:center; align-items:center; min-height:calc(100vh - 100px); padding: 40px 20px; }
        .auth-card { max-width: 400px; width: 100%; background: var(--bg-mid); border: 1px solid var(--glass-border); border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .auth-title { margin-bottom: 24px; text-align: center; font-size: 1.5rem; color: var(--text-primary); }
        .auth-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg-deep); color: var(--text-primary); font-size: 1rem; box-sizing: border-box; }
        .auth-input:focus { outline: none; border-color: var(--accent-lime); }
        .auth-btn { width: 100%; padding: 12px; border: none; border-radius: 999px; background: var(--accent-lime); color: var(--bg-deep); font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.2s; }
        .auth-btn:hover { transform: translateY(-2px); }
        .auth-link { display:block; text-align:center; margin-top: 20px; color: var(--accent-cyan); text-decoration: none; }
        .mesaj { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body class="theme-warm-amber">

    <div class="page-shell">
        <div id="header-yeri"></div>
        
        <main class="auth-page">
            <div class="auth-card">
                <h1 class="auth-title">Giriş Yap</h1>
                <div id="mesajKutusu" class="mesaj" style="display:none;"></div>
                <form id="girisForm">
                    <input type="email" id="email" class="auth-input" placeholder="E-posta adresiniz" required>
                    <input type="password" id="sifre" class="auth-input" placeholder="Şifreniz" required>
                    <button type="submit" class="auth-btn"><i class="fa fa-right-to-bracket"></i> Giriş Yap</button>
                </form>
                <a href="kayit_ol.html" class="auth-link">Hesabın yok mu? Kayıt Ol</a>
            </div>
        </main>
        
        <div id="footer-yeri"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/site.js"></script>
    <script>
        document.getElementById('girisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const sifre = document.getElementById('sifre').value;
            const mesajKutusu = document.getElementById('mesajKutusu');
            
            mesajKutusu.style.display = 'block';
            mesajKutusu.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Giriş yapılıyor...';
            mesajKutusu.style.color = 'var(--text-muted)';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: sifre });
                if (error) throw error;
                
                mesajKutusu.innerHTML = '<i class="fa fa-check-circle"></i> Giriş başarılı! Yönlendiriliyorsunuz...';
                mesajKutusu.style.color = 'var(--accent-lime)';
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (err) {
                mesajKutusu.innerHTML = '<i class="fa fa-exclamation-circle"></i> ' + (err.message || 'Giriş başarısız.');
                mesajKutusu.style.color = '#ef4444';
            }
        });
    </script>
</body>
</html>
