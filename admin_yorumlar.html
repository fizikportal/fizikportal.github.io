<script>
    const SUPABASE_URL = "https://xynrvyltphhlctgknsbl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_s4GbYjutbYiSdLEqzDG4gQ_rXbEnFyJ";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_EMAIL = "validebag.fizik@gmail.com";

    // ── XSS KALKANI — kullanıcı kontrollü TÜM metinler bundan geçer ──
    // & ile başlamak zorunlu (çift encode önlenir), sonra < > ve attribute
    // bağlamı için " ' temizlenir.
    function esc(deger) {
        return String(deger ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session || session.user.email !== ADMIN_EMAIL) {
            alert("Bu sayfaya erişim yetkiniz yok.");
            window.location.href = "index.html";
            return;
        }
        loadComments();
    });

    async function loadComments() {
        const { data: comments, error } = await _supabase.from('comments').select('*').order('created_at', { ascending: false });
        const listEl = document.getElementById('yorum-listesi');

        if (error || !comments || comments.length === 0) {
            listEl.innerHTML = "<p style='color:var(--text-muted);'>Hiç yorum bulunmuyor.</p>";
            return;
        }

        let html = '';
        comments.forEach(c => {
            const date = new Date(c.created_at).toLocaleDateString('tr-TR');
            const statusText = c.is_approved ? '<span style="color:var(--accent-lime);">Onaylı</span>' : '<span style="color:#fb923c;">Bekliyor</span>';

            html += `
            <div class="admin-card">
                <div class="yorum-bilgi">
                    <span><strong>${esc(c.user_name)}</strong> (${esc(c.user_email)}) - ${esc(c.content_id)}</span>
                    <span>${date} | ${statusText}</span>
                </div>
                <div class="yorum-metni">${esc(c.comment_text)}</div>

                ${c.admin_reply ? `<div style="background: rgba(200, 245, 66, 0.1); border-left: 3px solid var(--accent-lime); padding: 10px; margin-bottom: 10px; border-radius: 4px; color: var(--text-primary);"><strong>Admin Cevabı:</strong> ${esc(c.admin_reply)}</div>` : ''}

                <input type="text" class="cevap-input" id="reply-${esc(c.id)}" value="${esc(c.admin_reply || '')}" placeholder="Cevap yazın...">
                <div>
                    ${!c.is_approved ? `<button class="btn btn-onay" onclick="approveComment('${esc(c.id)}')">Onayla</button>` : ''}
                    <button class="btn btn-cevap" onclick="replyComment('${esc(c.id)}')">Cevabı Kaydet</button>
                    <button class="btn btn-sil" onclick="deleteComment('${esc(c.id)}')">Sil</button>
                </div>
            </div>`;
        });
        listEl.innerHTML = html;
    }

    async function approveComment(id) {
        await _supabase.from('comments').update({ is_approved: true }).eq('id', id);
        loadComments();
    }

    async function replyComment(id) {
        const replyText = document.getElementById('reply-' + id).value;
        const { error } = await _supabase.from('comments').update({ admin_reply: replyText }).eq('id', id);
        if (error) { alert("Hata: " + error.message); return; }
        alert("Cevap kaydedildi!");
        loadComments();
    }

    async function deleteComment(id) {
        if (!confirm("Bu yorumu silmek istediğinize emin misiniz?")) return;
        await _supabase.from('comments').delete().eq('id', id);
        loadComments();
    }
</script>
