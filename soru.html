<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Bankası — Fizik Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css?v=20260905" rel="stylesheet">
    <link href="assets/css/themes.css" rel="stylesheet">
</head>
<body class="theme-warm-amber">

    <div class="page-shell">
        <div id="header-yeri"></div>

        <div class="soru-layout" id="soru-layout-kapsayici">
            <button type="button" id="soru-menu-toggle" class="kategori-toggle-btn">
                <i class="fa fa-bars"></i> Soru Seç
            </button>
            <div id="soru-menu-overlay" class="okuma-menu-overlay"></div>

            <aside class="soru-sidebar" id="soru-sidebar">
                <div class="sidebar-card">
                    <div class="sidebar-header">
                        <i class="fa-solid fa-sliders"></i> Soru Seç
                    </div>
                    <div class="sidebar-content">
                        <div class="filtre-grup">
                            <label>Sınıf Seviyesi</label>
                            <select id="secim-sinif"><option value="">Tümü</option></select>
                        </div>
                        <div class="filtre-grup">
                            <label>Konu</label>
                            <select id="secim-konu"><option value="">Tümü</option></select>
                        </div>
                        <div class="filtre-grup">
                            <label>Kaç Soru Çözmek İstiyorsunuz?</label>
                            <div class="soru-sayisi-satiri">
                                <input type="number" id="soru-sayisi-input" value="10" min="1">
                                <span class="soru-sayisi-bilgi">Adet</span>
                            </div>
                        </div>
                        <button type="button" id="quiz-basla-btn" class="btn-kaydet-ana" style="width:100%;">
                            <i class="fa-solid fa-play"></i> Sorulara Başla
                        </button>
                        <p class="soru-toplam-bilgi" id="soru-toplam">0 soru mevcut.</p>
                        <div class="sidebar-kapat-yazi">Menüyü kapatmak için boş bir alana tıklayın.</div>
                    </div>
                </div>
            </aside>

            <section class="soru-main">
                <div id="soru-intro" class="soru-rehber editor-content site-block"></div>

                <!-- SINAV EKRANI (yeni ID seti: sinav-*) -->
                <div id="soru-quiz-alani" class="soru-sinav" style="display:none;">
                    <div id="sinav-govde" class="sinav-govde editor-content site-block"></div>
                    <div id="sinav-secenekler" class="sinav-secenekler"></div>

                    <div class="quiz-yardim-cubugu" style="margin-top: 20px;">
                        <button type="button" id="ipucu-btn" class="quiz-yardim-btn" style="display:none;">
                            <i class="fa-solid fa-key"></i> İpucu
                        </button>
                        <button type="button" id="cozum-btn" class="quiz-yardim-btn" style="display:none;">
                            <i class="fa-solid fa-lightbulb"></i> Çözümü Gör
                        </button>
                    </div>
                    <div id="ipucu-kutu" class="quiz-yardim-kutu" style="display:none;"></div>
                    <div id="cozum-kutu" class="quiz-yardim-kutu" style="display:none;"></div>

                    <div class="sinav-alt-cubuk">
                        <button type="button" id="sinav-geri-btn" class="quiz-yardim-btn" style="display:none;">
                            <i class="fa-solid fa-arrow-left"></i> Önceki Soru
                        </button>

                        <span id="sinav-ilerleme" style="font-size: 14px; font-weight: 600; color: var(--text-muted);"></span>

                        <div style="display: flex; gap: 10px;">
                            <button type="button" id="sinav-cikis-btn" class="quiz-yardim-btn" style="background: #ef4444; color: #fff;">
                                <i class="fa-solid fa-times"></i> Sınavdan Çık
                            </button>
                            <button type="button" id="sinav-ileri-btn" class="btn-kaydet-ana" style="display:none; width: auto; padding: 10px 20px;">
                                Sonraki Soru <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button type="button" id="sinav-bitir-btn" class="btn-kaydet-ana" style="display:none; width: auto; padding: 10px 20px;">
                                <i class="fa-solid fa-flag-checkered"></i> Sınavı Bitir
                            </button>
                        </div>
                    </div>
                </div>

                <!-- SONUÇ EKRANI -->
                <div id="sinav-sonuc" style="display:none;"></div>
            </section>
        </div>

        <div id="footer-yeri"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/site.js?v=20260905"></script>
    <script src="assets/js/soru.js?v=20260905"></script>
</body>
</html>
