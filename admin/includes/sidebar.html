        const aktifYol = window.location.pathname.split("/").pop().replace(".html", "") || "index";
        document.querySelectorAll(".app-sidebar .menu-link").forEach(link => {
            if (link.getAttribute("data-sayfa") === aktifYol) {
                link.classList.add("active");
            }
        });
    });
</script>
