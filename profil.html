<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - Fizik Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/themes.css" rel="stylesheet">
</head>
<body class="theme-warm-amber">

    <div class="page-shell">
        <div id="header-yeri"></div>
        
        <main class="auth-page">
            <div class="auth-card">
                <h1 class="auth-title">Hesap Ayarları</h1>
                
                <!-- AD SOYAD GÜNCELLEME -->
                <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--text-primary);">Profil Bilgileri</h3>
                <div id="profilMesaj" class="mesaj" style="display:none;"></div>
                <form id="profilForm" style="margin-bottom: 40px;">
                    <input type="text" id="adSoyad" class="auth-input" placeholder="Adınız ve Soyadınız">
                    <button type="submit" class="auth-btn"><i class="fa fa-save"></i> Profili Güncelle</button>
                </form>

                <!-- ŞİFRE DEĞİŞTİRME -->
                <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--text-primary);">Şifre Değiştir</h3>
                <div id="sifreMesaj" class="mesaj" style="display:none;"></div>
                <form id="sifreForm">
                    <input type="password" id="yeniSifre" class="auth-input" placeholder="Yeni Şifreniz (En az 6 karakter)" required minlength="6">
                    <button type="submit" class="auth-btn"><i class="fa fa-key"></i> Şifreyi Güncelle</button>
                </form>

                <button onclick="cikisYap()" class="auth-btn" style="background: #ef4444; color: #fff; margin-top: 30px;">
                    <i class="fa fa-sign-out-alt"></i> Oturumu Kapat (Çıkış)
                </button>
            </div>
        </main>
        
        <div id="footer-yeri"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'giris.html';
                return;
            }
            // Mevcut ad soyadı inputa yaz
            document.getElementById('adSoyad').value = session.user.user_metadata?.full_name || '';
        });

        // Ad Soyad Güncelleme
        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const adSoyad = document.getElementById('adSoyad').value;
            const mesaj = document.getElementById('profilMesaj');
            
            mesaj.style.display = 'block';
            mesaj.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Güncelleniyor...';
            mesaj.style.color = 'var(--text-muted)';

            const { error } = await supabaseClient.auth.updateUser({ data: { full_name: adSoyad } });
            if (error) {
                mesaj.innerHTML = '<i class="fa fa-exclamation-circle"></i> Hata: ' + error.message;
                mesaj.style.color = '#ef4444';
            } else {
                mesaj.innerHTML = '<i class="fa fa-check-circle"></i> Profil bilgileriniz güncellendi!';
                mesaj.style.color = 'var(--accent-lime)';
            }
        });

        // Şifre Güncelleme
        document.getElementById('sifreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const yeniSifre = document.getElementById('yeniSifre').value;
            const mesaj = document.getElementById('sifreMesaj');
            
            mesaj.style.display = 'block';
            mesaj.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Güncelleniyor...';
            mesaj.style.color = 'var(--text-muted)';

            const { error } = await supabaseClient.auth.updateUser({ password: yeniSifre });
            if (error) {
                mesaj.innerHTML = '<i class="fa fa-exclamation-circle"></i> Hata: ' + error.message;
                mesaj.style.color = '#ef4444';
            } else {
                mesaj.innerHTML = '<i class="fa fa-check-circle"></i> Şifreniz başarıyla güncellendi!';
                mesaj.style.color = 'var(--accent-lime)';
                document.getElementById('sifreForm').reset();
            }
        });
    </script>
</body>
</html>
